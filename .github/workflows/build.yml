name: Build & Release CosmoSSH

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux & Windows Packages and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install system packaging tools (7zip, zip)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application (Renderer + Main + Preload)
        run: pnpm build

      - name: Package Linux (.deb) and verify zero hardlinks
        env:
          USE_HARD_LINKS: "false"
        run: |
          pnpm exec electron-builder --linux deb --publish never
          if dpkg-deb -c release/*.deb | grep -E "^h| link to "; then
            echo "ERROR: Hardlinks detected inside .deb package!"
            exit 1
          fi

      - name: Package Windows Portable (.zip & .7z)
        env:
          USE_HARD_LINKS: "false"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm exec electron-builder --win --dir --publish never
          (cd release/win-unpacked && zip -r "../CosmoSSH-${VERSION}-win.zip" .)
          7z a -t7z -mx=7 "release/CosmoSSH-${VERSION}-win.7z" ./release/win-unpacked/*
          ls -lh release/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.zip
            release/*.7z
          name: CosmoSSH ${{ github.ref_name }}
          body: |
            ## 🌌 CosmoSSH 跨平台 SSH 终端与 SFTP 客户端 ${{ github.ref_name }} 发布！

            专为极客与运维工程师打造的轻量级、高颜值跨平台终端软件。

            ### 📦 最新安装包下载
            所有平台的最新安装包（Linux `.deb`、Windows 便携 `.zip`、Windows 高压缩 `.7z`）均已由 GitHub Actions 自动构建并发布在下方 Assets 列表中，直接点击下载即可使用！

            ### 🚀 本次更新亮点 (${{ github.ref_name }})
            - 🐧 **彻底修复 Linux `.deb` 安装硬链接报错**：
              - 解决因图标文件被重复打包产生跨分区硬链接导致的 `新建硬链接 ./opt/CosmoSSH/resources/assets/icon.png 时出错` 问题。
              - 规范化图标权限（`644`），并在 CI 中增加 `.deb` 零硬链接自动门禁检测。
            - 📂 **双栏文件传输界面精简与按需连接优化**：
              - 统一界面文案为简洁的 **「双栏模式」** / **「本地电脑」**。
              - SFTP 标签页改为按需连接（首次切入 SFTP 页面时才建立连接），避免软件一启动就在后台自动发起多余 SSH 连接。
              - 增强本地目录容错：无 Desktop 目录的精简 Linux 环境自动回退至家目录，输入不存在路径时给出明确错误提示。
            - 🔄 **软件内检查更新体验修复**：
              - 修复在设置页手动点击「检查更新」发现新版本时，若启动检测未命中则更新弹窗不显示的问题。
              - 网络异常或接口限流时准确提示错误信息，不再误报“已是最新版本”；Windows 端软件内更新优先推荐 `.zip` 便携包。
            - 🔐 **本地凭据硬件级加密 (`safeStorage`) & 终端搜索 (`Ctrl+F`) & 断线一键重连 & 无探针硬件监控** 全部内置。
          draft: false
          prerelease: false
          generate_release_notes: false
