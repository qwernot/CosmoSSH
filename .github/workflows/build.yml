name: Build & Release CosmoSSH

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux & Windows Packages and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install system packaging tools (7zip, zip)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application (Renderer + Main + Preload)
        run: pnpm build

      - name: Package Linux (.deb)
        run: pnpm exec electron-builder --linux deb

      - name: Package Windows Portable (.zip & .7z)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm exec electron-builder --win --dir
          (cd release/win-unpacked && zip -r "../CosmoSSH-${VERSION}-win.zip" .)
          7z a -t7z -mx=9 "release/CosmoSSH-${VERSION}-win.7z" ./release/win-unpacked/*
          ls -lh release/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.zip
            release/*.7z
          name: CosmoSSH ${{ github.ref_name }}
          body: |
            ## 🌌 CosmoSSH 跨平台 SSH 终端与 SFTP 客户端 ${{ github.ref_name }} 发布！

            专为极客与运维工程师打造的轻量级、高颜值跨平台终端软件。

            ### 📦 最新安装包下载
            所有平台的最新安装包（Linux `.deb`、Windows 便携 `.zip`、Windows 高压缩 `.7z`）均已由 GitHub Actions 自动构建并发布在下方 Assets 列表中，直接点击下载即可使用！

            ### 🚀 本次更新亮点 (${{ github.ref_name }})
            - 🛠️ **核心稳定性与 Electron 体验全面升级**：
              - 彻底替换 Electron 原生不支持的 `prompt()` / `alert()` / `confirm()`，改用深空主题自研交互弹窗与 Toast 提示，全面修复 SFTP 新建文件夹、新建文件、重命名等功能。
              - 修复设置页与云同步页异步加载后表单不自动回显的问题，云端 Pull 同步现已完整恢复终端偏好设置。
              - 修复 SSH 会话关闭时的事件监听泄漏及连接首屏欢迎信息偶发丢失竞态，应用退出时自动清理全部监控与连接。
              - 补全 Tailwind 缺失色阶（`cosmo-750` / `cosmo-400`），优化更新下载器流落盘完整性。
            - ⌨️ **终端新增一键重连 & 日志搜索 (`Ctrl+F`)**：
              - 会话意外断开后，终端工具栏直接提供 **「🔄 重新连接」** 一键原位重连。
              - 启用 `@xterm/addon-search`，按下 `Ctrl+F` 或点击搜索按钮即可快速检索终端历史输出。
            - 📂 **SFTP 双栏传输深度增强**：
              - 完整支持 **远程文件夹递归下载** 与 **非空远程目录递归删除**。
              - 下载完成后自动刷新左栏本地文件列表；修复双栏拖拽触发双重下载的问题。
              - 在线编辑器新增 2 MB 大文件与二进制文件保护拦截，防止误点大文件导致卡死。
              - 修复传输队列完成后的图标持续旋转问题及切换服务器时路径错乱问题。
            - 📊 **硬件实时监控增强 (Agentless)**：
              - 改用 `df -Pk /` 彻底修复 LVM 长设备名折行导致磁盘显示 `0%` 的问题。
              - 新增 5 秒执行超时保护防死锁，过滤 Docker / 虚拟桥接网卡避免网速重复叠加，兼容 Alpine/BusyBox。
              - 首轮采样后 700ms 自动极速二次采样，连上终端 1 秒内即出真实 CPU 与网速；切离终端页自动暂停轮询。
              - 详细 HUD 仪表盘新增操作系统发行版名称与 CPU 核心数展示。
            - 🔐 **本地凭据安全加密 & 自动化 CI 构建**：
              - 接入 Electron 原生 `safeStorage`（Windows DPAPI / Linux Keyring / macOS Keychain），本地存储的服务器密码、私钥与同步 Token 自动加密落盘，无缝兼容旧版配置平滑迁移。
              - 版本号统一由 `package.json` 单一数据源自动注入；构建发布迁移至 GitHub Actions 云端自动化打包。
          draft: false
          prerelease: false
          generate_release_notes: false
