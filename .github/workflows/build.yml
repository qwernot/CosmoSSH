name: Build & Release CosmoSSH

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 7zip and zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zip

      - name: Generate Windows .zip Package
        run: |
          mkdir -p win-temp
          WIN_7Z=$(ls release/CosmoSSH-*-win.7z | head -n 1)
          7z x "$WIN_7Z" -owin-temp
          ZIP_NAME=$(basename "$WIN_7Z" .7z).zip
          cd win-temp
          zip -r "../release/$ZIP_NAME" .
          cd ..
          rm -rf win-temp
          ls -lh release/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.zip
            release/*.7z
          name: CosmoSSH ${{ github.ref_name }}
          body: |
            ## 🌌 CosmoSSH 跨平台 SSH 终端与 SFTP 客户端 ${{ github.ref_name }} 发布！

            专为极客与运维工程师打造的轻量级、高颜值跨平台终端软件。

            ### 📦 最新安装包下载
            所有平台的最新安装包（Linux deb、Windows 便携 zip、Windows 7z）已发布在下方 Assets 列表中，直接点击下载即可使用！

            ### 🚀 本次更新亮点 (v1.0.1)
            - ⌨️ **复制粘贴优化**：支持直接使用 `Ctrl+C`（智能识别：选中文本时复制，无选中时发送 SIGINT 中断）与 `Ctrl+V`（读取系统剪贴板粘贴），支持鼠标右键智能复制/粘贴。
            - 📂 **SFTP 双向拖拽传输 (WinSCP 级体验)**：
              - **外部拖入**：将桌面或本地资源管理器中的文件/文件夹直接拖拽进 SFTP 窗口立即加入上传队列（支持目录递归上传）。
              - **拖出到外部**：直接将 SFTP 列表中的文件拖出到操作系统桌面或文件夹完成下载。
            - 🌐 **设置新增作者主页**：在设置中心新增作者主页 `666228.xyz`，支持一键在系统默认浏览器中打开。
            - 🔄 **软件内更新与仓库更新通道**：
              - 内置智能版本检测（遵循“逢十进一”规范：`1.0.0` -> `1.0.1`）；
              - 支持在软件内直接下载适配当前操作系统的最新安装包（带实时进度条），或一键跳转至 GitHub Releases 仓库页面更新。
            - 🏷️ **自定义服务器分组**：支持添加/重命名/切换配色/安全删除服务器分组，云端 E2EE 同步完整纳管。
            - 📡 **双模真实网络测速**：原生 ICMP Ping + TCP SSH 握手探测，穿透本地代理与 TUN 模式。
            - 🛡️ **Cloudflare 端到端加密云同步**：AES-256-GCM + PBKDF2 零知识加密跨设备同步。
          draft: false
          prerelease: false
          generate_release_notes: false
